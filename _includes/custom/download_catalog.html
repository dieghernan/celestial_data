{% assign groups = site.data.datasets | group_by: 'group' %}
{% for group in groups %}
<h2 id="{{ group.name | slugify }}">{{ group.name | escape }}</h2>
<div class="row">
  {% for dataset in group.items %}
  <div class="col-12 col-lg-6 mb-3">{% include custom/download_card.html dataset=dataset heading='h3' %}</div>
  {% endfor %}
</div>
{% endfor %}
