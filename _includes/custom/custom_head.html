<link rel="describedby" type="text/plain" href="{{ '/llms.txt' | relative_url }}">
{% if page.dataset_id %}
{% include custom/dataset_jsonld.html %}
{% elsif page.dataset_collection %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Dataset",
  "@id": {{ '/' | absolute_url | append: '#collection' | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "name": "Celestial Data",
  "description": "Celestial datasets for the J2000 epoch derived from d3-celestial, with GeoJSON and GeoPackage geometries and complementary CSV name tables.",
  "identifier": "https://doi.org/10.5281/zenodo.7561601",
  "license": "https://opensource.org/licenses/BSD-3-Clause",
  "isAccessibleForFree": true,
  "creator": [{"@type": "Person", "name": "Olaf Frohn"}, {"@type": "Person", "name": "Diego Hernangómez", "identifier": "https://orcid.org/0000-0001-8457-4658"}],
  "isBasedOn": "https://github.com/ofrohn/d3-celestial/",
  "hasPart": [
    {% for dataset in site.data.datasets %}
    {"@type": "Dataset", "@id": {{ '/datasets/' | append: dataset.id | append: '/#dataset' | absolute_url | jsonify }}, "name": {{ dataset.name | jsonify }}, "description": {{ dataset.description | jsonify }}, "license": "https://opensource.org/licenses/BSD-3-Clause", "creator": [{"@type": "Person", "name": "Olaf Frohn"}, {"@type": "Person", "name": "Diego Hernangómez", "identifier": "https://orcid.org/0000-0001-8457-4658"}], "url": {{ '/datasets/' | append: dataset.id | append: '/' | absolute_url | jsonify }}}{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
