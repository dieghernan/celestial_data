<div class="h-card" hidden>
  <a class="u-url u-uid" rel="me author" href="{{ site.author.url | escape }}">
    <img class="u-photo rounded-circle mr-1" src="{{ site.author.avatar | escape }}"
         width="32" height="32" alt="" loading="lazy">
    <span class="p-name">{{ site.author.name | escape }}</span>
  </a>
</div>
